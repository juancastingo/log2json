[package]
name = "log2json"
version = "0.1.0"
edition = "2021"
authors = ["Juan Castiñeira <juancastingo@gmail.com>"]
description = "Fast, streaming CLI tool converting unstructured and semi-structured logs into normalized JSON / JSONL with automatic field detection."
repository = "https://github.com/juancastingo/log2json"
homepage = "https://github.com/juancastingo/log2json"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["logs", "json", "jsonl", "parser", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"
